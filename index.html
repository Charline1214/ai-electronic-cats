<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ai电子猫咪</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        :root{--green:#4ade80;--pink:#f472b6;--blue:#60a5fa;--yellow:#fbbf24;--orange:#fb923c;--purple:#a78bfa;--red:#ef4444}
        body{font-family:'Press Start 2P','Microsoft YaHei',monospace;background:linear-gradient(135deg,#1a1a2e,#16213e 50%,#0f3460);min-height:100vh;overflow-x:hidden;color:#fff}
        .app{max-width:480px;margin:0 auto;min-height:100vh;padding:8px;position:relative;font-family:'Press Start 2P','Microsoft YaHei',monospace}
        .title{text-align:center;padding:15px 0;font-size:16px;color:var(--green);text-shadow:2px 2px 0 #1a1a1a;font-family:'Press Start 2P','Microsoft YaHei',monospace}
        .pbox{background:#3d3d3d;border:4px solid #1a1a1a;box-shadow:0 0 0 2px #666,4px 4px 0 #1a1a1a,inset 0 0 15px rgba(0,0,0,.3);font-family:'Press Start 2P','Microsoft YaHei',monospace}
        .pbtn{background:linear-gradient(180deg,#5a5a5a,#3d3d3d);border:3px solid #1a1a1a;color:#fff;padding:10px 16px;font-family:'Press Start 2P','Microsoft YaHei',monospace;font-size:11px;cursor:pointer;box-shadow:0 4px 0 #1a1a1a;transition:.1s}
        .pbtn:active{transform:translateY(4px);box-shadow:none}
        .pbtn.g{background:linear-gradient(180deg,var(--green),#22c55e);color:#1a1a1a}
        .pbtn.p{background:linear-gradient(180deg,var(--pink),#ec4899);color:#1a1a1a}
        .pbtn.r{background:linear-gradient(180deg,var(--red),#dc2626)}
        .pbtn.pu{background:linear-gradient(180deg,var(--purple),#8b5cf6)}
        .pbtn.b{background:linear-gradient(180deg,var(--blue),#3b82f6)}
        .pbtn:disabled{opacity:.4;pointer-events:none}
        .scr{display:none;animation:fi .3s}.scr.on{display:block}
        @keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
        /* 品种选择 */
        .bsel{padding:15px;font-family:'Press Start 2P','Microsoft YaHei',monospace}
        .bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:15px 0}
        .bitem{display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:.2s}
        .bitem:active{transform:scale(.95)}
        .bicon{width:65px;height:65px;border-radius:50%;border:3px solid #666;overflow:hidden;background:#2d2d2d;box-shadow:0 3px 0 #1a1a1a}
        .bitem.sel .bicon{border-color:var(--green);box-shadow:0 0 12px var(--green),0 3px 0 #1a1a1a}
        .bicon svg{width:100%;height:100%}
        .bname{margin-top:5px;font-size:8px;color:#ccc;text-align:center;font-family:'Press Start 2P','Microsoft YaHei',monospace}
        .bitem.sel .bname{color:var(--green)}
        /* 性别选择 */
        .gsel{padding:30px 20px;text-align:center;font-family:'Press Start 2P','Microsoft YaHei',monospace}
        .gender-opts{display:flex;gap:20px;justify-content:center;margin:25px 0}
        .gopt{width:120px;padding:20px 15px;background:#2d2d2d;border:4px solid #666;border-radius:15px;cursor:pointer;transition:.2s;text-align:center;font-family:'Press Start 2P','Microsoft YaHei',monospace}
        .gopt:active{transform:scale(.95)}
        .gopt.sel-m{border-color:var(--blue);box-shadow:0 0 15px var(--blue)}
        .gopt.sel-f{border-color:var(--pink);box-shadow:0 0 15px var(--pink)}
        .gopt-icon{font-size:40px;margin-bottom:10px}
        .gopt-label{font-size:12px;font-family:'Press Start 2P','Microsoft YaHei',monospace}
        .gopt-sub{font-size:8px;color:#aaa;margin-top:5px;font-family:'Press Start 2P','Microsoft YaHei',monospace}
        /* 命名 */
        .nsel{padding:25px 20px;text-align:center;font-family:'Press Start 2P','Microsoft YaHei',monospace}
        .cprev{width:120px;height:120px;margin:15px auto;border-radius:15px;background:#2d2d2d;border:3px solid #666;display:flex;align-items:center;justify-content:center}
        .cprev svg{width:100px;height:100px}
        .pinput{background:#1a1a1a;border:3px solid #666;color:#fff;padding:12px;font-family:'Press Start 2P','Microsoft YaHei',monospace;font-size:13px;width:100%;max-width:260px;text-align:center;outline:none}
        .pinput:focus{border-color:var(--green)}
        /* 主游戏 */
        .gscreen{padding:8px;font-family:'Press Start 2P','Microsoft YaHei',monospace}
        .sbar{display:flex;justify-content:space-between;padding:8px;background:#2d2d2d;border:3px solid #1a1a1a;margin-bottom:8px;box-shadow:0 3px 0 #1a1a1a;font-family:'Press Start 2P','Microsoft YaHei',monospace}
        .sitem{display:flex;align-items:center;gap:4px;font-size:8px;font-family:'Press Start 2P','Microsoft YaHei',monospace}
        .sfill{width:50px;height:10px;background:#1a1a1a;border:2px solid #666;overflow:hidden}
        .sinner{height:100%;transition:width .3s}
        .hbar{background:linear-gradient(90deg,#ef4444,#f97316)}
        .hapbar{background:linear-gradient(90deg,#fbbf24,#f59e0b)}
        .cbar{background:linear-gradient(90deg,#60a5fa,#3b82f6)}
        .sel-info{text-align:center;padding:6px;background:#2d2d2d;border:3px solid #1a1a1a;margin-bottom:8px;font-size:10px;color:var(--yellow);display:flex;justify-content:center;align-items:center;gap:8px;font-family:'Press Start 2P','Microsoft YaHei',monospace}
        .gender-tag{font-size:10px;padding:2px 6px;border-radius:8px;font-family:'Press Start 2P','Microsoft YaHei',monospace;cursor:pointer;transition:transform .2s}
        .gender-tag:hover{transform:scale(1.1)}
        .gender-m{background:var(--blue);color:#fff}
        .gender-f{background:var(--pink);color:#fff}
        /* 多猫显示 */
        .cats-row{display:flex;gap:8px;justify-content:center;margin-bottom:8px}
        .ccard{flex:1;max-width:220px;background:linear-gradient(180deg,#4a5568,#2d3748);border:3px solid #1a1a1a;border-radius:10px;padding:8px;cursor:pointer;transition:.2s;position:relative;min-height:200px;font-family:'Press Start 2P','Microsoft YaHei',monospace}
        .ccard.sel{border-color:var(--green);box-shadow:0 0 12px rgba(74,222,128,.4)}
        .ccard-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;font-size:9px;font-family:'Press Start 2P','Microsoft YaHei',monospace}
        .ccard-name{color:var(--yellow);text-shadow:1px 1px 0 #1a1a1a;font-family:'Press Start 2P','Microsoft YaHei',monospace}
        .ccard-age{color:#ccc;font-size:8px;font-family:'Press Start 2P','Microsoft YaHei',monospace}
        .ccard-avatar{width:100%;display:flex;justify-content:center}
        .ccard-avatar svg{width:110px;height:110px}
        .ccard-needs{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-top:5px;font-family:'Press Start 2P','Microsoft YaHei',monospace}
        .ccard .sick-tag{position:absolute;top:5px;left:5px;background:var(--purple);color:#fff;padding:2px 6px;border-radius:6px;font-size:7px;font-family:'Press Start 2P','Microsoft YaHei',monospace}
        .ccard .sleep-tag{position:absolute;top:5px;right:5px;background:#1a1a1a;color:var(--yellow);padding:2px 6px;border-radius:6px;font-size:7px;font-family:'Press Start 2P','Microsoft YaHei',monospace}
        .ccard .zzz{position:absolute;top:15px;right:10px;font-size:14px;animation:zf 2s infinite;font-family:'Press Start 2P','Microsoft YaHei',monospace}
        @keyframes zf{0%,100%{opacity:.5;transform:translateY(0)}50%{opacity:1;transform:translateY(-8px)}}
        .ccard .waste{position:absolute;bottom:5px;left:5px;display:flex;gap:4px;font-family:'Press Start 2P','Microsoft YaHei',monospace}
        .ccard .waste span{font-size:14px;font-family:'Press Start 2P','Microsoft YaHei',monospace}
        /* 小猫 */
        .baby-row{display:flex;justify-content:center;margin-bottom:8px;font-family:'Press Start 2P','Microsoft YaHei',monospace}
        .baby-card{background:linear-gradient(180deg,#fce7f3,#fbcfe8);border:3px solid #1a1a1a;border-radius:10px;padding:8px 15px;display:flex;align-items:center;gap:8px;font-family:'Press Start 2P','Microsoft YaHei',monospace}
        .baby-card svg{width:50px;height:50px}
        .baby-info{font-size:8px;color:#1a1a1a;font-family:'Press Start 2P','Microsoft YaHei',monospace}
        .baby-info .bname{font-size:9px;font-weight:bold;font-family:'Press Start 2P','Microsoft YaHei',monospace}
        /* 气泡 */
        .bubble{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;color:#1a1a1a;padding:10px 15px;border-radius:12px;font-size:9px;max-width:250px;text-align:center;box-shadow:3px 3px 0 #1a1a1a;animation:pi .3s;z-index:50;pointer-events:none;font-family:'Press Start 2P','Microsoft YaHei',monospace}
        @keyframes pi{from{opacity:0;transform:translate(-50%,-50%) scale(.5)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
        .badge{padding:3px 6px;border-radius:8px;font-size:7px;animation:pu 1s infinite;font-family:'Press Start 2P','Microsoft YaHei',monospace}
        @keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
        .badge-h{background:var(--red);color:#fff}
        .badge-s{background:var(--purple);color:#fff}
        .badge-o{background:#6b7280;color:#fff}
        /* 操作按钮 */
        .agrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px;font-family:'Press Start 2P','Microsoft YaHei',monospace}
        .abtn{display:flex;flex-direction:column;align-items:center;padding:8px 4px;background:linear-gradient(180deg,#4a5568,#2d3748);border:3px solid #1a1a1a;border-radius:8px;cursor:pointer;box-shadow:0 3px 0 #1a1a1a;font-family:'Press Start 2P','Microsoft YaHei',monospace}
        .abtn:active{transform:translateY(3px);box-shadow:none}
        .abtn:disabled{opacity:.3;pointer-events:none}
        .abtn .ai{width:30px;height:30px;margin-bottom:2px}
        .abtn .al{font-size:7px;color:#ccc;font-family:'Press Start 2P','Microsoft YaHei',monospace}
        /* 弹窗 */
        .modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:100;padding:15px;font-family:'Press Start 2P','Microsoft YaHei',monospace}
        .modal.on{display:flex}
        .mcontent{background:#3d3d3d;border:4px solid #1a1a1a;border-radius:15px;padding:18px;max-width:340px;width:100%;text-align:center;font-family:'Press Start 2P','Microsoft YaHei',monospace}
        .mtitle{font-size:13px;margin-bottom:15px;color:var(--yellow);font-family:'Press Start 2P','Microsoft YaHei',monospace}
        .food-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
        .fitem{display:flex;flex-direction:column;align-items:center;cursor:pointer;padding:6px 3px;background:#2d2d2d;border:3px solid #666;border-radius:8px;transition:.2s;font-family:'Press Start 2P','Microsoft YaHei',monospace}
        .fitem:active{transform:scale(.95);border-color:var(--green)}
        .fitem svg{width:40px;height:40px;margin-bottom:3px}
        .fitem span{font-size:7px;font-family:'Press Start 2P','Microsoft YaHei',monospace}
        .fmsg{font-size:8px;color:var(--pink);margin-bottom:10px;min-height:20px;padding:4px;background:rgba(0,0,0,.3);border-radius:6px;font-family:'Press Start 2P','Microsoft YaHei',monospace}
        /* 结婚弹窗 */
        .marry-cats{display:flex;justify-content:center;gap:15px;margin:15px 0;font-family:'Press Start 2P','Microsoft YaHei',monospace}
        .marry-cat{text-align:center;font-family:'Press Start 2P','Microsoft YaHei',monospace}
        .marry-cat svg{width:60px;height:60px}
        .marry-cat .mcname{font-size:9px;margin-top:5px;color:var(--yellow);font-family:'Press Start 2P','Microsoft YaHei',monospace}
        .marry-heart{font-size:30px;align-self:center;animation:hb 1s infinite;font-family:'Press Start 2P','Microsoft YaHei',monospace}
        @keyframes hb{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
        /* 小猫弹窗 */
        .baby-preview{margin:15px auto;width:100px;height:100px;background:#fce7f3;border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid #f9a8d4;font-family:'Press Start 2P','Microsoft YaHei',monospace}
        .baby-preview svg{width:70px;height:70px}
        .baby-btns{display:flex;gap:10px;justify-content:center;margin-top:15px}
        /* 聊天 */
        .chatbox{display:flex;flex-direction:column;height:70vh;font-family:'Press Start 2P','Microsoft YaHei',monospace}
        .chatbox.on{display:flex}
        .chathead{display:flex;align-items:center;justify-content:space-between;padding:8px;background:#2d2d2d;border-bottom:3px solid #1a1a1a;font-family:'Press Start 2P','Microsoft YaHei',monospace}
        .chathead span{font-size:10px;color:var(--yellow);font-family:'Press Start 2P','Microsoft YaHei',monospace}
        .chatmsgs{flex:1;overflow-y:auto;padding:10px;background:#1a1a1a;display:flex;flex-direction:column;gap:6px;font-family:'Press Start 2P','Microsoft YaHei',monospace}
        .cmsg{max-width:80%;padding:7px 10px;border-radius:10px;font-size:9px;line-height:1.4;word-wrap:break-word;font-family:'Press Start 2P','Microsoft YaHei',monospace}
        .cmsg.u{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:3px}
        .cmsg.c{align-self:flex-start;background:#4a5568;color:#fff;border-bottom-left-radius:3px}
        .chatin{display:flex;gap:6px;padding:8px;background:#2d2d2d;border-top:3px solid #1a1a1a;font-family:'Press Start 2P','Microsoft YaHei',monospace}
        .chatinp{flex:1;background:#1a1a1a;border:3px solid #666;color:#fff;padding:7px;font-family:'Press Start 2P','Microsoft YaHei',monospace;font-size:9px;border-radius:6px;outline:none}
        .chatinp:focus{border-color:var(--green)}
        .typing{font-size:8px;color:#888;padding:3px 10px;display:none;font-family:'Press Start 2P','Microsoft YaHei',monospace}
        .typing.on{display:block}
        /* 通知 */
        .notif{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:var(--pink);color:#1a1a1a;padding:8px 15px;border-radius:15px;font-size:9px;box-shadow:0 3px 10px rgba(0,0,0,.3);animation:ns .3s;z-index:200;max-width:90%;text-align:center;font-family:'Press Start 2P','Microsoft YaHei',monospace}
        @keyframes ns{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
        /* 死亡 */
        .death{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:400;padding:20px;font-family:'Press Start 2P','Microsoft YaHei',monospace}
        .death.on{display:flex}
        .death-c{text-align:center;max-width:320px;font-family:'Press Start 2P','Microsoft YaHei',monospace}
        .death-c h2{font-size:16px;color:var(--red);margin-bottom:15px;font-family:'Press Start 2P','Microsoft YaHei',monospace}
        .death-c p{font-size:10px;color:#ccc;margin-bottom:20px;line-height:1.6;font-family:'Press Start 2P','Microsoft YaHei',monospace}
        .death-c .dbtns{display:flex;flex-direction:column;gap:10px;font-family:'Press Start 2P','Microsoft YaHei',monospace}
        .info{text-align:center;padding:10px;background:#2d2d2d;border:3px solid #1a1a1a;border-radius:8px;font-size:7px;color:#888;line-height:1.6;font-family:'Press Start 2P','Microsoft YaHei',monospace}
        .rename-b{background:none;border:none;color:var(--blue);font-family:inherit;font-size:7px;cursor:pointer;text-decoration:underline}
        .heart-fx{position:fixed;font-size:20px;animation:hf 1s forwards;pointer-events:none;z-index:60;font-family:'Press Start 2P','Microsoft YaHei',monospace}
        @keyframes hf{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-40px) scale(1.3)}}
        @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
        @keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
        @keyframes sleep{0%,100%{transform:scale(1)}50%{transform:scale(1.01)}}
        .anim-bounce svg{animation:bounce .5s infinite}
        .anim-wiggle svg{animation:wiggle .3s infinite}
        .anim-sleep svg{animation:sleep 2s infinite}
    </style>
</head>
<body>
<div class="app">
    <h1 class="title">ai电子猫咪</h1>

    <!-- 品种选择 -->
    <div class="scr on" id="sBreed">
        <div class="pbox bsel">
            <p style="text-align:center;font-size:10px;color:#aaa;margin-bottom:10px">请选择你要领养的猫咪品种</p>
            <div class="bgrid" id="breedGrid"></div>
            <div style="text-align:center;margin-top:12px">
                <button class="pbtn g" id="btnBreedOk" disabled>确认选择</button>
            </div>
        </div>
    </div>

    <!-- 性别选择 -->
    <div class="scr" id="sGender">
        <div class="pbox gsel">
            <p style="font-size:11px;color:#aaa;margin-bottom:5px">选择猫咪的性别</p>
            <div class="gender-opts">
                <div class="gopt" data-g="male" id="goptM">
                    <div class="gopt-icon">♂</div>
                    <div class="gopt-label" style="color:var(--blue)">公猫</div>
                    <div class="gopt-sub">帅气的小王子</div>
                </div>
                <div class="gopt" data-g="female" id="goptF">
                    <div class="gopt-icon">♀</div>
                    <div class="gopt-label" style="color:var(--pink)">母猫</div>
                    <div class="gopt-sub">可爱的小公主</div>
                </div>
            </div>
            <div style="display:flex;gap:10px;justify-content:center;margin-top:15px">
                <button class="pbtn" id="btnGenderBack">返回</button>
                <button class="pbtn g" id="btnGenderOk" disabled>确认</button>
            </div>
        </div>
    </div>

    <!-- 命名 -->
    <div class="scr" id="sName">
        <div class="pbox nsel">
            <p style="font-size:10px;color:#aaa">给你的小猫咪取个名字吧</p>
            <div class="cprev" id="namePrev"></div>
            <div style="margin:15px 0"><input type="text" class="pinput" id="nameInput" placeholder="输入猫咪名字" maxlength="10"></div>
            <div style="display:flex;gap:10px;justify-content:center">
                <button class="pbtn" id="btnNameBack">返回</button>
                <button class="pbtn g" id="btnNameOk">确认领养</button>
            </div>
        </div>
    </div>

    <!-- 主游戏 -->
    <div class="scr" id="sGame">
        <div class="gscreen">
            <div class="sbar">
                <div class="sitem"><span>饱食</span><div class="sfill"><div class="sinner hbar" id="barH" style="width:80%"></div></div></div>
                <div class="sitem"><span>开心</span><div class="sfill"><div class="sinner hapbar" id="barHp" style="width:70%"></div></div></div>
                <div class="sitem"><span>清洁</span><div class="sfill"><div class="sinner cbar" id="barC" style="width:90%"></div></div></div>
            </div>
            <div class="sel-info" id="selInfo">--</div>
            <div class="cats-row" id="catsRow"></div>
            <div class="baby-row" id="babyRow"></div>
            <div class="agrid" id="actionGrid">
                <div class="abtn" data-act="feed"><svg class="ai" viewBox="0 0 50 50"><ellipse cx="25" cy="25" rx="20" ry="12" fill="#d4a574"/><polygon points="5,25 0,18 0,32" fill="#d4a574"/><circle cx="35" cy="22" r="3" fill="#333"/></svg><span class="al">喂食</span></div>
                <div class="abtn" data-act="med"><svg class="ai" viewBox="0 0 50 50"><rect x="15" y="10" width="20" height="30" fill="#ef4444" rx="5"/><rect x="20" y="5" width="10" height="10" fill="#fff"/><circle cx="25" cy="25" r="5" fill="#fff"/></svg><span class="al">喂药</span></div>
                <div class="abtn" data-act="pet"><svg class="ai" viewBox="0 0 50 50"><path d="M20 35Q15 30 20 25Q25 20 30 25" stroke="#fdba74" stroke-width="4" fill="none"/><path d="M30 25Q35 20 40 25" stroke="#fdba74" stroke-width="4" fill="none"/><path d="M25 30Q20 35 25 40L35 40Q40 35 35 30" fill="#fdba74"/><path d="M35 10Q38 5 42 10Q45 15 35 20Q25 15 28 10Q32 5 35 10" fill="#f472b6"/></svg><span class="al">摸摸</span></div>
                <div class="abtn" data-act="comb"><svg class="ai" viewBox="0 0 50 50"><rect x="10" y="10" width="30" height="8" fill="#8b4513" rx="2"/><rect x="12" y="18" width="4" height="15" fill="#a0522d"/><rect x="19" y="18" width="4" height="15" fill="#a0522d"/><rect x="26" y="18" width="4" height="15" fill="#a0522d"/><rect x="33" y="18" width="4" height="15" fill="#a0522d"/></svg><span class="al">梳毛</span></div>
                <div class="abtn" data-act="poop"><svg class="ai" viewBox="0 0 50 50"><ellipse cx="25" cy="35" rx="15" ry="8" fill="#8b4513"/><ellipse cx="20" cy="32" rx="5" ry="4" fill="#654321"/><rect x="35" y="10" width="4" height="25" fill="#9ca3af"/><ellipse cx="37" cy="35" rx="8" ry="6" fill="#6b7280"/></svg><span class="al">铲屎</span></div>
                <div class="abtn" data-act="pee"><svg class="ai" viewBox="0 0 50 50"><ellipse cx="25" cy="38" rx="18" ry="6" fill="#fbbf24" opacity=".6"/><path d="M25 15Q20 25 25 30Q30 25 25 15" fill="#60a5fa"/><rect x="38" y="8" width="3" height="30" fill="#8b4513"/></svg><span class="al">清理</span></div>

// ========== 游戏状态 ==========
function newCat(breed, name, gender) {
    const now = Date.now();
    const today = new Date().toDateString();
    return {breed, name, gender, age:0, hunger:80, happiness:70, cleanliness:90,
        poopCount:0, peeCount:0, lastFed:now, lastMealTime:now, missedMeals:0,
        isSick:false, isSleeping:false, isDead:false, deathReason:'',
        birthDate:today, lastAgeUpdate:today};
}

let G = {
    cats: [],
    babyCat: null,
    isMarried: false,
    selIdx: 0,
    chatHistories: {}, // 每只猫独立的聊天记录 {catIndex: [{role, content}]}
    addingCat: false,
    pendingBreed: null,
    pendingGender: null
};

// 获取当前选中猫的聊天记录
function getChatHistory() {
    if (!G.chatHistories) {
        G.chatHistories = {};
    }
    const key = G.selIdx.toString();
    if (!G.chatHistories[key]) {
        G.chatHistories[key] = [];
    }
    return G.chatHistories[key];
}

// 保存当前选中猫的聊天记录
function setChatHistory(history) {
    G.chatHistories[G.selIdx.toString()] = history;
}

// ========== SVG生成 ==========
function catSVG(breed, age, sleeping=false, small=false) {
    const b = BREEDS[breed] || BREEDS['american-shorthair'];
    const sc = small ? 0.4 : Math.min(1, 0.5 + age * 0.025);
    const sz = small ? 70 : 160 * sc;
    const ox = (180 - sz) / 2, oy = (180 - sz) / 2;
    const op = age >= 15 ? 0.85 : 1;
    const eye = sleeping
        ? `<path d="M${ox+sz*.25} ${oy+sz*.5}Q${ox+sz*.32} ${oy+sz*.47} ${ox+sz*.39} ${oy+sz*.5}" stroke="#333" stroke-width="2.5" fill="none"/>
           <path d="M${ox+sz*.61} ${oy+sz*.5}Q${ox+sz*.68} ${oy+sz*.47} ${ox+sz*.75} ${oy+sz*.5}" stroke="#333" stroke-width="2.5" fill="none"/>`
        : `<circle cx="${ox+sz*.32}" cy="${oy+sz*.5}" r="${sz*.07}" fill="${b.eye}"/><circle cx="${ox+sz*.68}" cy="${oy+sz*.5}" r="${sz*.07}" fill="${b.eye}"/>
           <circle cx="${ox+sz*.34}" cy="${oy+sz*.5}" r="${sz*.035}" fill="#333"/><circle cx="${ox+sz*.70}" cy="${oy+sz*.5}" r="${sz*.035}" fill="#333"/>`;
    let extra = '';
    if (b.mask) extra += `<ellipse cx="${ox+sz*.5}" cy="${oy+sz*.38}" rx="${sz*.22}" ry="${sz*.16}" fill="${b.mask}" opacity="${op}"/>`;
    if (b.stripe) extra += `<path d="M${ox+sz*.22} ${oy+sz*.35}L${ox+sz*.32} ${oy+sz*.38}L${ox+sz*.22} ${oy+sz*.41}" fill="${b.stripe}" opacity="${op}"/>
        <path d="M${ox+sz*.78} ${oy+sz*.35}L${ox+sz*.68} ${oy+sz*.38}L${ox+sz*.78} ${oy+sz*.41}" fill="${b.stripe}" opacity="${op}"/>`;
    if (b.folded) extra += `<ellipse cx="${ox+sz*.2}" cy="${oy+sz*.33}" rx="${sz*.1}" ry="${sz*.08}" fill="${b.body}" opacity="${op}"/>
        <ellipse cx="${ox+sz*.8}" cy="${oy+sz*.33}" rx="${sz*.1}" ry="${sz*.08}" fill="${b.body}" opacity="${op}"/>`;
    return `<svg viewBox="0 0 180 180" style="opacity:${op}">
        <ellipse cx="${ox+sz*.5}" cy="${oy+sz*.55}" rx="${sz*.42}" ry="${sz*.36}" fill="${b.body}"/>
        <polygon points="${ox+sz*.17},${oy+sz*.33} ${ox+sz*.05},${oy+sz*.05} ${ox+sz*.37},${oy+sz*.22}" fill="${b.body}"/>
        <polygon points="${ox+sz*.83},${oy+sz*.33} ${ox+sz*.95},${oy+sz*.05} ${ox+sz*.63},${oy+sz*.22}" fill="${b.body}"/>
        ${extra}${eye}
        <ellipse cx="${ox+sz*.5}" cy="${oy+sz*.65}" rx="${sz*.11}" ry="${sz*.06}" fill="#ffb6c1"/>
        <path d="M${ox+sz*.4} ${oy+sz*.7}Q${ox+sz*.5} ${oy+sz*.77} ${ox+sz*.6} ${oy+sz*.7}" stroke="#333" stroke-width="2" fill="none"/>
        <ellipse cx="${ox+sz*.5}" cy="${oy+sz*.42}" rx="${sz*.04}" ry="${sz*.03}" fill="#333"/>
    </svg>`;
}

// ========== 存储 ==========
function save() { localStorage.setItem('aiCatV2', JSON.stringify(G)); }
function load() {
    const d = localStorage.getItem('aiCatV2');
    if (d) {
        try {
            G = JSON.parse(d);
            // 确保chatHistories存在
            if (!G.chatHistories) {
                G.chatHistories = {};
            }
            return true;
        } catch(e){}
    }
    // 迁移旧版
    const old = localStorage.getItem('aiCatGame');
    if (old) {
        try {
            const o = JSON.parse(old);
            if (o.selectedBreed && o.catName) {
                G.cats = [newCat(o.selectedBreed, o.catName, o.gender || 'female')];
                G.cats[0].age = o.age || 0;
                G.cats[0].hunger = o.hunger || 80;
                G.cats[0].happiness = o.happiness || 70;
                G.cats[0].cleanliness = o.cleanliness || 90;
                G.cats[0].isSick = o.isSick || false;
                G.cats[0].isSleeping = o.isSleeping || false;
                G.cats[0].isDead = o.isDead || false;
                G.cats[0].lastFed = o.lastFed || Date.now();
                G.cats[0].lastMealTime = o.lastMealTime || Date.now();
                G.cats[0].birthDate = o.birthDate || new Date().toDateString();
                G.cats[0].lastAgeUpdate = o.lastAgeUpdate || new Date().toDateString();
                // 迁移旧版聊天记录到新格式
                if (o.chatHistory && o.chatHistory.length > 0) {
                    G.chatHistories['0'] = o.chatHistory;
                }
                save();
                localStorage.removeItem('aiCatGame');
                return true;
            }
        } catch(e){}
    }
    return false;
}
function clearSave() { localStorage.removeItem('aiCatV2'); }

function show(id) { document.querySelectorAll('.scr').forEach(s=>s.classList.remove('on')); document.getElementById(id).classList.add('on'); }

function notify(t) {

    const n = document.createElement('div'); n.className='notif'; n.textContent=t;
    document.body.appendChild(n); setTimeout(()=>n.remove(), 3000);
}

function bubble(t) {
    document.querySelectorAll('.bubble').forEach(b=>b.remove());
    const b = document.createElement('div'); b.className='bubble'; b.textContent=t;
    document.body.appendChild(b); setTimeout(()=>b.remove(), 3500);
}

function hearts(x, y) {
    for (let i=0;i<3;i++) setTimeout(()=>{
        const h=document.createElement('div'); h.className='heart-fx'; h.textContent='❤️';
        h.style.left=(x+Math.random()*60-30)+'px'; h.style.top=(y+Math.random()*30)+'px';
        document.body.appendChild(h); setTimeout(()=>h.remove(),1000);
    }, i*150);
}

// ========== 初始化品种网格 ==========
function initBreedGrid() {
    const grid = document.getElementById('breedGrid');
    grid.innerHTML = '';
    for (const [id, b] of Object.entries(BREEDS)) {
        const div = document.createElement('div');
        div.className = 'bitem'; div.dataset.breed = id;
        div.innerHTML = `<div class="bicon">${catSVG(id, 3, false, true)}</div><span class="bname">${b.name}</span>`;
        div.onclick = () => {
            document.querySelectorAll('.bitem').forEach(i=>i.classList.remove('sel'));
            div.classList.add('sel');
            G.pendingBreed = id;
            document.getElementById('btnBreedOk').disabled = false;
        };
        grid.appendChild(div);
    }
}

// ========== 初始化食物网格 ==========
function initFoodGrid() {
    const grid = document.getElementById('foodGrid');
    grid.innerHTML = '';
    FOODS.forEach(f => {
        const div = document.createElement('div');
        div.className = 'fitem';
        div.innerHTML = `<svg viewBox="0 0 60 60">${f.svg}</svg><span>${f.name}</span>`;
        div.onmouseenter = () => document.getElementById('fmsg').textContent = f.msg;
        div.onclick = () => { doFeed(f); document.getElementById('mFeed').classList.remove('on'); };
        grid.appendChild(div);
    });
}

// ========== 渲染游戏界面 ==========
function renderGame() {
    renderCats();
    renderBaby();
    updateSelInfo();
    updateBars();
    updateMarryBtn();
    updateAddBtn();
    updateInfo();
}

function renderCats() {
    const row = document.getElementById('catsRow');
    row.innerHTML = '';
    G.cats.forEach((cat, i) => {
        if (cat.isDead) return;
        const card = document.createElement('div');
        card.className = 'ccard' + (i === G.selIdx ? ' sel' : '');
        if (cat.isSleeping) card.classList.add('anim-sleep');
        else card.classList.add('anim-bounce');
        
        let needsHTML = '';
        if (cat.isSick) needsHTML += '<span class="badge badge-s">生病</span>';
        if (cat.hunger < 40) needsHTML += '<span class="badge badge-h">饿了</span>';
        if (cat.happiness < 40) needsHTML += '<span class="badge badge-h">求摸摸</span>';
        if (cat.age >= 15) needsHTML += '<span class="badge badge-o">老年</span>';
        
        let wasteHTML = '';
        for (let w=0;w<cat.poopCount;w++) wasteHTML += '<span>💩</span>';
        for (let w=0;w<cat.peeCount;w++) wasteHTML += '<span>💧</span>';
        
        const gTag = cat.gender === 'male' ? '<span class="gender-tag gender-m" onclick="toggleGender('+i+',event)">♂</span>' : '<span class="gender-tag gender-f" onclick="toggleGender('+i+',event)">♀</span>';
        
        card.innerHTML = `
            ${cat.isSick ? '<div class="sick-tag">生病了</div>' : ''}
            ${cat.isSleeping ? '<div class="sleep-tag">呼呼大睡</div><div class="zzz">Z z z</div>' : ''}
            <div class="ccard-head">
                <span class="ccard-name">${cat.name} ${gTag}</span>
                <span class="ccard-age">${cat.age}岁</span>
            </div>
            <div class="ccard-avatar">${catSVG(cat.breed, cat.age, cat.isSleeping)}</div>
            <div class="ccard-needs">${needsHTML}</div>
            <div class="waste">${wasteHTML}</div>
        `;
        card.onclick = (e) => { if(e.target.classList.contains('gender-tag')) return; G.selIdx = i; save(); renderGame(); };
        row.appendChild(card);
    });
}

function renderBaby() {
    const row = document.getElementById('babyRow');
    row.innerHTML = '';
    if (!G.babyCat) return;
    const b = G.babyCat;
    const gTag = b.gender === 'male' ? '♂ 小王子' : '♀ 小公主';
    row.innerHTML = `<div class="baby-card">
        ${catSVG(b.breed, 0, false, true)}
        <div class="baby-info"><div class="bname">${b.name}</div>${BREEDS[b.breed].name} | ${gTag}</div>
    </div>`;
}

function updateSelInfo() {
    const el = document.getElementById('selInfo');
    if (G.cats.length === 0) { el.innerHTML = '--'; return; }
    const c = G.cats[G.selIdx];
    if (!c || c.isDead) { el.innerHTML = '--'; return; }
    const gTag = c.gender === 'male' ? '<span class="gender-tag gender-m" onclick="toggleGender(G.selIdx,event)">♂</span>' : '<span class="gender-tag gender-f" onclick="toggleGender(G.selIdx,event)">♀</span>';
    el.innerHTML = `<span>${c.name} ${gTag} ${c.age}岁</span><button class="rename-b" onclick="openRename()">改名</button>`;
}

function updateBars() {
    const c = G.cats[G.selIdx];
    if (!c) return;
    document.getElementById('barH').style.width = c.hunger + '%';
    document.getElementById('barHp').style.width = c.happiness + '%';
    document.getElementById('barC').style.width = c.cleanliness + '%';
}

function updateMarryBtn() {
    const btn = document.getElementById('btnMarry');
    const living = G.cats.filter(c => !c.isDead);
    if (living.length === 2 && !G.isMarried && living[0].age >= 1 && living[1].age >= 1) {
        btn.style.display = '';
    } else {
        btn.style.display = 'none';
    }
}

function updateAddBtn() {
    const living = G.cats.filter(c => !c.isDead);
    document.getElementById('btnAddCat').disabled = living.length >= 2;
}

function updateInfo() {
    const el = document.getElementById('infoText');
    const living = G.cats.filter(c => !c.isDead);
    let txt = '每天0点猫咪长大一岁 | 正常喂养可活到20岁';
    if (living.length === 2 && !G.isMarried) txt += ' | 两只猫都≥1岁可结婚';
    if (G.isMarried) txt += ' | 已结婚';
    el.textContent = txt;
}

// ========== 操作处理 ==========
function getSel() { return G.cats[G.selIdx]; }

// 喂食
function doFeed(food) {
    const c = getSel(); if (!c || c.isDead) return;
    c.hunger = Math.min(100, c.hunger + 20);
    c.happiness = Math.min(100, c.happiness + 10);
    c.lastFed = Date.now();
    c.lastMealTime = Date.now();
    c.missedMeals = 0;
    bubble(food.msg);
    const rect = document.querySelectorAll('.ccard')[G.selIdx]?.getBoundingClientRect();
    if (rect) hearts(rect.left + rect.width/2, rect.top + rect.height/2);
    save(); renderGame();
}

// 喂药
function doMed() {
    const c = getSel(); if (!c || c.isDead) return;
    if (c.isSick) {
        c.isSick = false; c.happiness = Math.min(100, c.happiness + 15);
        bubble('谢谢主人！我感觉好多了喵~');
        const rect = document.querySelectorAll('.ccard')[G.selIdx]?.getBoundingClientRect();
        if (rect) hearts(rect.left + rect.width/2, rect.top + rect.height/2);
    } else { bubble('我很健康喵~不需要吃药~'); }
    save(); renderGame();
}

// 摸摸
function doPet() {
    const c = getSel(); if (!c || c.isDead) return;
    if (c.isSleeping) { notify('猫咪在睡觉呢~'); return; }
    c.happiness = Math.min(100, c.happiness + 15);
    bubble('好舒服喵~再多摸一摸~');
    const card = document.querySelectorAll('.ccard')[G.selIdx];
    if (card) { card.classList.remove('anim-bounce'); card.classList.add('anim-wiggle'); setTimeout(()=>{card.classList.remove('anim-wiggle');card.classList.add('anim-bounce');},1000); }
    const rect = card?.getBoundingClientRect();
    if (rect) hearts(rect.left + rect.width/2, rect.top + rect.height/2);
    save(); renderGame();
}

// 梳毛
function doComb() {
    const c = getSel(); if (!c || c.isDead) return;
    if (c.isSleeping) { notify('猫咪在睡觉呢~'); return; }
    c.cleanliness = Math.min(100, c.cleanliness + 20);
    c.happiness = Math.min(100, c.happiness + 5);
    bubble('毛发变得好顺滑喵~');
    save(); renderGame();
}

// 铲屎
function doPoop() {
    const c = getSel(); if (!c || c.isDead) return;
    if (c.poopCount > 0) { c.poopCount = 0; c.cleanliness = Math.min(100, c.cleanliness + 15); bubble('谢谢你帮我铲屎喵~'); }
    else bubble('现在还没有便便哦喵~');
    save(); renderGame();
}

// 清理
function doPee() {
    const c = getSel(); if (!c || c.isDead) return;
    if (c.peeCount > 0) { c.peeCount = 0; c.cleanliness = Math.min(100, c.cleanliness + 15); bubble('地面变干净了喵~'); }
    else bubble('现在还没有嘘嘘哦喵~');
    save(); renderGame();
}

// 吵醒
function doWake() {
    const c = getSel(); if (!c || c.isDead) return;
    if (!c.isSleeping) {
        bubble('主子还清醒着呢喵~');
        return;
    }
    c.isSleeping = false;
    c.happiness = Math.max(0, c.happiness - 20);
    bubble(ANGRY_QUOTES[Math.floor(Math.random()*ANGRY_QUOTES.length)]);
    save(); renderGame();
}

document.getElementById('actionGrid').addEventListener('click', e => {
    const btn = e.target.closest('.abtn');
    if (!btn) return;

    if (act === 'feed') document.getElementById('mFeed').classList.add('on');
    else if (act === 'med') doMed();

function sendMsg() {

    const msg = inp.value.trim();
    if (!msg) return;
    addMsg(msg, 'u');
    inp.value = '';
    document.getElementById('typingInd').classList.add('on');

        document.getElementById('typingInd').classList.remove('on');
        addMsg(reply, 'c');
    }).catch(() => {
        document.getElementById('typingInd').classList.remove('on');
        addMsg('喵？网络好像有点问题喵~', 'c');
    });
}

function addMsg(text, type) {
    const box = document.getElementById('chatMsgs');
    const d = document.createElement('div');
    d.className = 'cmsg ' + (type === 'u' ? 'u' : 'c');
    d.textContent = text;
    box.appendChild(d);
    box.scrollTop = box.scrollHeight;
    const history = getChatHistory();
    history.push({role: type === 'u' ? 'user' : 'cat', content: text});
    if (history.length > 50) setChatHistory(history.slice(-50));
    else setChatHistory(history);
    save();
}

// ========== 游戏循环 ==========
let loopStarted = false;
function startLoop() {
    if (loopStarted) return;
    loopStarted = true;
    
    // 每秒更新
    setInterval(() => {
        let changed = false;
        G.cats.forEach(c => {
            if (c.isDead) return;
            // 年龄检查
            const today = new Date().toDateString();
            if (c.lastAgeUpdate !== today) {
                c.age++;
                c.lastAgeUpdate = today;
                if (c.age >= 20) { handleDeath(G.cats.indexOf(c), 'old'); return; }
                else notify(`${c.name}今天${c.age}岁啦！`);
                changed = true;
            }
            // 喂食检查
            const hrsSinceFed = (Date.now() - c.lastFed) / 3600000;
            if (hrsSinceFed >= 24) { handleDeath(G.cats.indexOf(c), 'starve'); return; }
            const hrsSinceMeal = (Date.now() - c.lastMealTime) / 3600000;
            if (hrsSinceMeal >= 8 && !c.isSick) {
                c.missedMeals++;
                c.lastMealTime = Date.now();
                if (c.missedMeals >= 1) { c.isSick = true; bubble(`${c.name}生病了！快给它喂药喵~`); }
                changed = true;
            }
            // 状态衰减
            if (!c.isSleeping) {
                if (c.hunger > 0) c.hunger = Math.max(0, c.hunger - 0.15);
                if (c.happiness > 0) c.happiness = Math.max(0, c.happiness - 0.1);
                if (c.cleanliness > 0) c.cleanliness = Math.max(0, c.cleanliness - 0.08);
            }
        });
        if (changed) save();
        renderGame();
    }, 1000);
    
    // 随机排泄
    setInterval(() => {
        G.cats.forEach(c => {
            if (c.isDead || c.isSleeping) return;
            if (Math.random() < 0.08 && c.poopCount < 20) { c.poopCount++; save(); renderGame(); }
            if (Math.random() < 0.08 && c.peeCount < 30) { c.peeCount++; save(); renderGame(); }
        });
    }, 20000);
    
    // 随机睡觉
    setInterval(() => {
        G.cats.forEach(c => {
            if (c.isDead || c.isSleeping) return;
            if (Math.random() < 0.08) { c.isSleeping = true; save(); renderGame(); }
        });
    }, 60000);
    
    // 随机说话
    setInterval(() => {
        const c = getSel();
        if (!c || c.isDead || c.isSleeping) return;
        if (Math.random() < 0.2) {
            let q = POSITIVE_QUOTES;
            if (c.isSick) q = SICK_QUOTES;
            else if (c.age >= 15) q = OLD_QUOTES;
            else if (c.hunger < 40) q = HUNGER_QUOTES;
            bubble(q[Math.floor(Math.random()*q.length)]);
        }
    }, 45000);
}

    initBreedGrid();

    if (load() && G.cats.some(c => !c.isDead)) {
        // 确保selIdx有效
        if (G.selIdx >= G.cats.length || G.cats[G.selIdx]?.isDead) {
            G.selIdx = G.cats.findIndex(c => !c.isDead);
            if (G.selIdx < 0) G.selIdx = 0;
        }
        enterGame();
    } else if (G.cats.some(c => c.isDead)) {
        // 有死亡的猫
        const deadIdx = G.cats.findIndex(c => c.isDead);
        if (deadIdx >= 0) handleDeath(deadIdx, G.cats[deadIdx].deathReason);
        show('sGame');
        renderGame();
    }
    // 否则显示品种选择
}

init();
</script>
</body>
